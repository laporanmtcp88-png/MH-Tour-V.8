name: MH Tour APK Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/mhtour/audio/MainActivity.kt

          grep -q '^android.useAndroidX=true$' android/gradle.properties
          grep -q '^android.enableJetifier=true$' android/gradle.properties

          echo "Android project OK"
          echo "LiveKit configuration OK"

      - name: Create release keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/mh-tour-release.jks" \
            -storetype JKS \
            -alias mh-tour-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=MH Tour, OU=Mobile, O=MH Tour, L=Indonesia, ST=West Java, C=ID"

      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace --warning-mode all \
            -PMH_KEYSTORE_FILE="$RUNNER_TEMP/mh-tour-release.jks" \
            -PMH_KEYSTORE_PASSWORD=changeit \
            -PMH_KEY_ALIAS=mh-tour-release \
            -PMH_KEY_PASSWORD=changeit \
            clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK Release tidak ditemukan!"
            exit 1
          fi

          echo "======================================"
          echo "MH TOUR RELEASE APK BERHASIL DIBUAT"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MH-Tour-V5.1-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
